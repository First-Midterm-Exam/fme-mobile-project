name: fme_mobile_project
description: "Asistente Readiness: complemento móvil de CMMI Appraisal Readiness Platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  permission_handler: ^12.0.1
  provider: ^6.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
